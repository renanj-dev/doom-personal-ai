<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <link rel="manifest" href="/static/manifest.webmanifest" />
  <title>Doom</title>
  <style>
    :root{color-scheme:dark;--bg:#06100a;--panel:#0b1710e8;--line:#193324;--accent:#164d2b;--accent-2:#2b7042;--text:#edf5ef;--muted:#91a89a;--glow:#2f8a50}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 50% 0,#12301f 0,#06100a 43%,#040805 100%);color:var(--text);min-height:100vh}
    .wrap{max-width:900px;margin:0 auto;padding:20px 14px 28px}.top{display:flex;align-items:center;gap:14px;padding:8px 4px 16px}.orb{width:48px;height:48px;border:1px solid #275839;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 30px #276c4080;background:radial-gradient(circle,#57ad72 0,#246338 42%,#0a1a0f 70%)}
    h1{font-size:22px;margin:0;letter-spacing:.15em}.status{font-size:12px;color:#8fa998}.panel{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 18px 50px #000b}.messages{min-height:55vh;max-height:70vh;overflow:auto;padding:16px}.msg{display:flex;margin:10px 0}.bubble{max-width:88%;padding:12px 14px;border-radius:14px;line-height:1.5;white-space:pre-wrap}.user{justify-content:flex-end}.user .bubble{background:#0e2817;border:1px solid #235032}.doom .bubble{background:#0d1711;border:1px solid #1a2d22}.bar{display:flex;gap:10px;padding:12px;border-top:1px solid var(--line)}input,button{font:inherit}input{flex:1;background:#071009;border:1px solid #23422e;color:#fff;border-radius:12px;padding:13px}input:focus{outline:2px solid #2f8a50aa;border-color:#2f8a50}button{border:0;border-radius:12px;padding:0 18px;background:var(--accent-2);color:#fff;font-weight:700;cursor:pointer}button:hover{filter:brightness(1.08)}button:disabled{opacity:.5}.key{display:flex;gap:8px;margin:0 0 12px}.key input{width:100%}.hint{font-size:12px;color:var(--muted);margin:10px 3px}.empty{text-align:center;color:var(--muted);padding:60px 12px}
    @media(max-width:600px){.wrap{padding:14px 10px 22px}.messages{min-height:62vh;max-height:72vh}.bar{padding:10px}.bar button{padding:0 14px}.bubble{max-width:94%}}
  </style>
</head>
<body>
<div class="wrap">
  <div class="top"><div class="orb">◉</div><div><h1>DOOM</h1><div class="status">PERSONAL AI · LOCAL SYSTEM ONLINE</div></div></div>
  <div class="key"><input id="key" type="password" placeholder="Chave Doom" /><button id="saveKey">Salvar</button></div>
  <div class="panel">
    <div id="messages" class="messages"><div class="empty">Doom está pronta.<br>Digite uma mensagem para iniciar.</div></div>
    <form id="form" class="bar"><input id="input" autocomplete="off" placeholder="Fale com Doom..." /><button id="send">Enviar</button></form>
  </div>
  <div class="hint">A chave Doom fica somente neste navegador. Quando usando Ollama local, suas mensagens para o cérebro permanecem no PC.</div>
</div>
<script>
const $=s=>document.querySelector(s); const key=$('#key'), input=$('#input'), msgs=$('#messages'), form=$('#form'), send=$('#send');
key.value=localStorage.getItem('doom_key')||'';
$('#saveKey').onclick=()=>{localStorage.setItem('doom_key',key.value); alert('Chave salva neste navegador.')};
function add(role,text){ if(msgs.querySelector('.empty')) msgs.innerHTML=''; const row=document.createElement('div'); row.className='msg '+role; const b=document.createElement('div'); b.className='bubble'; b.textContent=text; row.appendChild(b); msgs.appendChild(row); msgs.scrollTop=msgs.scrollHeight; }
form.onsubmit=async e=>{e.preventDefault(); const text=input.value.trim(); if(!text)return; if(!key.value) return alert('Digite sua Chave Doom primeiro.'); add('user',text); input.value=''; send.disabled=true; try{ const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json','X-Doom-Key':key.value},body:JSON.stringify({session_id:'main',message:text})}); const d=await r.json(); if(!r.ok) throw new Error(d.detail||'Erro'); add('doom',d.reply);}catch(err){add('doom','Não consegui concluir a solicitação: '+err.message)}finally{send.disabled=false;input.focus();}};
</script>
</body>
</html>
