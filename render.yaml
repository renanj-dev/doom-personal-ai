services:
  - type: web
    name: doom-personal-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DOOM_API_KEY
        sync: false
      - key: DOOM_USER_NAME
        value: Renan
      - key: CORTEX_PROVIDERS
        value: openrouter,openai
      - key: LLM_PROVIDER
        value: openrouter
      - key: DOOM_MODEL
        value: openrouter/free
      - key: OLLAMA_MODEL
        value: qwen3:0.6b
      - key: OPENROUTER_MODEL
        value: openrouter/free
      - key: OPENAI_MODEL
        value: gpt-5.6-luna
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_SITE_NAME
        value: Doom Personal AI
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SEED_MEMORIES
        value: "true"
      - key: CORS_ORIGINS
        value: ""
      - key: SECURITY_SESSION_HOURS
        value: "12"
      - key: SECURITY_LEGACY_API_KEY
        value: "true"
      - key: AGENT_ENABLED
        value: "false"
      - key: AGENT_MAX_STEPS
        value: "8"
      - key: AGENT_MAX_TOOL_CALLS
        value: "5"
