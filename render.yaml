services:
  - type: web
    name: doom-personal-ai
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DOOM_API_KEY
        sync: false
      - key: DOOM_USER_NAME
        value: Renan
      - key: LLM_PROVIDER
        value: openrouter
      - key: DOOM_MODEL
        value: openrouter/free
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_BASE_URL
        value: https://openrouter.ai/api/v1
      - key: OPENROUTER_SITE_URL
        sync: false
      - key: OPENROUTER_SITE_NAME
        value: Doom Personal AI
      - key: DATABASE_URL
        sync: false
      - key: SEED_MEMORIES
        value: "true"
      - key: CORS_ORIGINS
        value: ""
