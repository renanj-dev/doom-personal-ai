services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: doom
      POSTGRES_USER: doom
      POSTGRES_PASSWORD: doom
    volumes:
      - doom_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U doom -d doom"]
      interval: 5s
      timeout: 5s
      retries: 20

  doom:
    build: .
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  doom_pgdata:
